name: Python Linting

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint:
    name: Lint with pylint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pylint
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pylint --output-format=github proton_drive_gts.py test_proton_drive_gts.py
          python -m pylint --output-format=github ui_flow.py proton_drive_gts_ui.py test_ui_flow.py test_proton_drive_gts_ui.py
